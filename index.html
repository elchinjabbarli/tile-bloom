    <title>Tile Bloom — Triple Match Puzzle</title>
    <style>
      /* First-paint splash: shown until the app bundle is ready. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(120% 90% at 50% 0%, #0a3f5f 0%, #041420 55%, #02101a 100%);
        z-index: 999;
        transition: opacity 0.45s ease;
        font-family: system-ui, sans-serif;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot .mark {
        width: 84px;
        height: 84px;
        border-radius: 26px;
        background: linear-gradient(180deg, #ddfcff 0%, #a9edf7 100%);
        border: 2px solid rgba(18, 38, 52, 0.3);
        box-shadow:
          inset 0 3px 0 rgba(255, 255, 255, 0.75),
          inset 0 -4px 0 rgba(10, 24, 40, 0.12),
          0 14px 30px rgba(2, 10, 18, 0.5),
          0 0 38px rgba(89, 226, 255, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: bootPulse 1.6s ease-in-out infinite;
      }
      #boot .mark span {
        width: 26px;
        height: 26px;
        border-radius: 9px;
        background: linear-gradient(180deg, #ffb3c8 0%, #ff6f9e 100%);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.6), inset 0 -2px 0 rgba(120, 20, 50, 0.25), 0 4px 10px rgba(180, 40, 90, 0.45);
      }
      #boot .t {
        color: #9fe8ff;
        letter-spacing: 0.28em;
        font-size: 12px;
        text-transform: uppercase;
        opacity: 0.85;
      }
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.07); }
      }
