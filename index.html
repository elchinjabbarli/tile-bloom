    <title>Tile Bloom — Triple Match Puzzle</title>
    <style>
      /* First-paint splash: shown until the app bundle is ready. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(120% 90% at 50% 0%, #0a3f5f 0%, #041420 55%, #02101a 100%);
        z-index: 999;
        transition: opacity 0.45s ease;
        font-family: system-ui, sans-serif;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot .mark {
        width: 84px;
        height: 84px;
        border-radius: 24px;
        border: 2px solid rgba(120, 226, 255, 0.55);
        box-shadow: 0 0 34px rgba(89, 226, 255, 0.35), inset 0 0 24px rgba(120, 226, 255, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: bootPulse 1.6s ease-in-out infinite;
      }
      #boot .mark span {
        width: 26px;
        height: 26px;
        border-radius: 9px;
        background: linear-gradient(160deg, #7ff3ff 10%, #2f9ecf 90%);
        box-shadow: 0 0 18px rgba(127, 243, 255, 0.8);
      }
      #boot .t {
        color: #9fe8ff;
        letter-spacing: 0.28em;
        font-size: 12px;
        text-transform: uppercase;
        opacity: 0.85;
      }
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.07); }
      }
    </style>
